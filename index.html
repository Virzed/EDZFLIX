<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDZFLIX</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tabs button{padding:10px 18px;border:none;border-radius:8px;background:#222;color:#fff;font-weight:bold}.tabs button.active{background:#1DB954}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.card{background:#222;border-radius:10px;overflow:hidden;cursor:pointer}.card img{width:100%;height:160px;object-fit:cover}.card p{padding:6px;font-size:11px;text-align:center;margin:0}.live-box{background:#222;padding:15px 5px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #333}#playerContainer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column;justify-content:center}#videoPlayer{width:100%;height:60%}#iframePlayer{width:100%;height:60%;border:none;display:none}.close-btn{position:absolute;top:10px;right:10px;background:red;color:#fff;border:none;padding:12px 18px;border-radius:8px;z-index:10000}</style></head><body>
<h1 style="text-align:center;color:#1DB954">EDZFLIX</h1>
<div class="tabs"><button id="moviesTab" class="active" onclick="switchTab('movie')">Movies</button><button id="tvTab" onclick="switchTab('tv')">TV Shows</button><button id="liveTab" onclick="switchTab('live')">🔴 LIVE</button></div>
<div id="movies" class="grid"></div><div id="tv" class="grid" style="display:none"></div>
<div id="live" class="grid" style="display:none">
<div class="live-box" onclick="playYT('jfKfPfyJRdk')">📺<br><b>Lofi 24/7</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playYT('86YLFOc6N1I')">🚀<br><b>NASA LIVE</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playHLS('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🏀<br><b>PBA TEST</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playHLS('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🏀<br><b>NBA TEST</b><br><span style="color:#1DB954">● LIVE</span></div>
</div>
<div id="playerContainer"><button class="close-btn" onclick="closePlayer()">X Close</button><video id="videoPlayer" controls autoplay></video><iframe id="iframePlayer" allowfullscreen></iframe></div>
<script>
const moviesData=[{id:299536,t:"Infinity War",p:"7WsyChQLEftFiDOVTGkv3hFpyyt.jpg"},{id:299534,t:"Endgame",p:"or06FN3Dka5tukK1e9sl16pB3iy.jpg"},{id:19995,t:"Avatar",p:"kyeqWdyUXW608qlYkRqosgbbJyK.jpg"},{id:27205,t:"Inception",p:"ljsZTbVsrQSqZgWeep2B1QiDKuh.jpg"},{id:155,t:"Dark Knight",p:"qJ2tW6WMUDux911r6m7haRef0WH.jpg"},{id:603,t:"The Matrix",p:"f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg"}];
const tvData=[{id:1399,t:"Game of Thrones",p:"u3bZgnGQ9T01sWNhyveQz0wH0Hl.jpg"},{id:1396,t:"Breaking Bad",p:"ggFHVNu6YYI5L9pCfOacjizRGt.jpg"},{id:1399,t:"House of Dragon",p:"etj8E2o0Bud0HkONVQPjyCkIvpv.jpg"},{id:66732,t:"Stranger Things",p:"49WJfeN0moxb9IPfGn8AIqMGskD.jpg"},{id:1398,t:"The Sopranos",p:"rTc7ZXgQq34fHBZdJkZk7YQ1zhT.jpg"},{id:1402,t:"Walking Dead",p:"rqeYMLryjcawh2JeakpQDkWXbR.jpg"}];
function display(list,containerId){const c=document.getElementById(containerId);c.innerHTML='';list.forEach(m=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<img src="https://image.tmdb.org/t/p/w500/${m.p}"><p>${m.t}</p>`;d.onclick=()=>{document.getElementById('playerContainer').style.display='flex';document.getElementById('videoPlayer').style.display='none';document.getElementById('iframePlayer').style.display='block';document.getElementById('iframePlayer').src=containerId==='tv'?`https://vidlink.pro/tv/${m.id}/1/1`:`https://vidlink.pro/movie/${m.id}`};c.appendChild(d);});}
function playYT(v){document.getElementById('playerContainer').style.display='flex';document.getElementById('videoPlayer').style.display='none';document.getElementById('iframePlayer').style.display='block';document.getElementById('iframePlayer').src=`https://www.youtube.com/embed/${v}?autoplay=1`;}
function playHLS(u){document.getElementById('playerContainer').style.display='flex';document.getElementById('iframePlayer').style.display='none';document.getElementById('videoPlayer').style.display='block';const vid=document.getElementById('videoPlayer');if(Hls.isSupported()){const h=new Hls();h.loadSource(u);h.attachMedia(vid);h.on(Hls.Events.MANIFEST_PARSED,()=>vid.play());}else{vid.src=u;vid.play();}}
function closePlayer(){document.getElementById('playerContainer').style.display='none';document.getElementById('videoPlayer').pause();document.getElementById('iframePlayer').src='';}
function switchTab(t){document.getElementById('movies').style.display=t==='movie'?'grid':'none';document.getElementById('tv').style.display=t==='tv'?'grid':'none';document.getElementById('live').style.display=t==='live'?'grid':'none';document.getElementById('moviesTab').classList.toggle('active',t==='movie');document.getElementById('tvTab').classList.toggle('active',t==='tv');document.getElementById('liveTab').classList.toggle('active',t==='live');if(t==='movie')display(moviesData,'movies');if(t==='tv')display(tvData,'tv');}
display(moviesData,'movies');
</script></body></html>
