
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDZFLIX</title>
<style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tabs button{padding:10px 18px;border:none;border-radius:8px;background:#222;color:#fff;font-weight:bold}.tabs button.active{background:#1DB954}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.card{background:#222;border-radius:10px;overflow:hidden;cursor:pointer}.card img{width:100%;height:160px;object-fit:cover}.card p{padding:6px;font-size:11px;text-align:center;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#playerContainer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column}#iframePlayer{width:100%;height:100%;border:none}.close-btn{position:absolute;top:10px;right:10px;z-index:10000;background:red;color:#fff;border:none;padding:10px 15px;border-radius:5px;font-weight:bold}.live-box{background:linear-gradient(135deg,#1a1a1a,#2a2a2a);padding:20px 5px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #333}</style></head><body>
<h1 style="text-align:center;color:#1DB954;margin:5px 0;font-size:32px">EDZ</h1>
<div class="tabs"><button id="moviesTab" class="active" onclick="switchTab('movie')">Movies</button><button id="tvTab" onclick="switchTab('tv')">TV Shows</button><button id="liveTab" onclick="switchTab('live')">🔴 LIVE CHANNELS</button></div>
<input type="text" id="search" placeholder="Search movie..." style="width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:none;box-sizing:border-box" onkeyup="searchContent()">
<div id="movies" class="grid"></div><div id="tv" class="grid" style="display:none"></div>
<div id="live" class="grid" style="display:none">
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">📺<br><b>GMA</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">📺<br><b>TV5</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🎬<br><b>A2Z</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🏀<br><b>PBA</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🏀<br><b>NBA</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🎨<br><b>CARTOON</b><br><span style="color:#1DB954">● LIVE</span></div>
</div>
<div id="playerContainer"><button class="close-btn" onclick="closePlayer()">X Close</button><iframe id="iframePlayer" allowfullscreen></iframe><div style="text-align:center;padding:10px;background:#111"><button onclick="document.getElementById('iframePlayer').requestFullscreen()" style="padding:10px 20px;background:#1DB954;border:none;border-radius:8px;color:#fff">⛶ Fullscreen</button></div></div>
<script>
const moviesData=[{id:299536,t:"Avengers: Infinity War",p:"7WsyChQLEftFiDOVTGkv3hFpyyt.jpg"},{id:299534,t:"Avengers: Endgame",p:"or06FN3Dka5tukK1e9sl16pB3iy.jpg"},{id:19995,t:"Avatar",p:"kyeqWdyUXW608qlYkRqosgbbJyK.jpg"},{id:118340,t:"Guardians of Galaxy",p:"r7vmZjiyZw9rpJMQJdXpjgiCOk9.jpg"},{id:120,t:"Lord of the Rings",p:"6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg"},{id:27205,t:"Inception",p:"ljsZTbVsrQSqZgWeep2B1QiDKuh.jpg"},{id:603,t:"The Matrix",p:"f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg"},{id:155,t:"The Dark Knight",p:"qJ2tW6WMUDux911r6m7haRef0WH.jpg"},{id:550,t:"Fight Club",p:"pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg"},{id:13,t:"Forrest Gump",p:"saHP97rTPS5eLmrLQEcANmKrsFl.jpg"},{id:272,t:"Batman Begins",p:"4MpN4kIEqUjW8OPhorfSzdqadPz.jpg"},{id:157336,t:"Interstellar",p:"gEU2QniE6E77NI6lCU6MxlNBvIx.jpg"},{id:671,t:"Harry Potter",p:"aGBuiirBIQ7oLRVCfwWn4yxQ1xY.jpg"},{id:122,t:"LOTR: Return of King",p:"rCzpDGLbOoPwLjy3OAm5N6Hh0z5J.jpg"},{id:24428,t:"The Avengers",p:"RYMX2wcKCBAr24UyPD7xwmjaTn.jpg"},{id:99861,t:"Avengers: Age of Ultron",p:"4ssDuvEDkSArWEdyBl2X5EHvYKU.jpg"}];
const tvData=[{id:1399,t:"Game of Thrones",p:"u3bZgnGQ9T01sWNhyveQz0wH0Hl.jpg"},{id:1396,t:"Breaking Bad",p:"ggFHVNu6YYI5L9pCfOacjizRGt.jpg"},{id:1402,t:"The Walking Dead",p:"rqeYMLryjcawh2JeRpCVUDXYM5b.jpg"},{id:87108,t:"Chernobyl",p:"h1rQR1v5Bv3kFv2eZ2qGv9g.jpg"},{id:62560,t:"Mr Robot",p:"kEM0qN2hKYYL6pCCYjWik4J0vN.jpg"}];
function displayMovies(list,containerId){const container=document.getElementById(containerId);container.innerHTML='';list.forEach(item=>{const div=document.createElement('div');div.className='card';div.innerHTML=`<img src="https://image.tmdb.org/t/p/w500/${item.p}"><p>${item.t}</p>`;div.onclick=()=>openPlayer(item.id,containerId==='tv'?'tv':'movie');container.appendChild(div);});}
function openPlayer(id,type){document.getElementById('playerContainer').style.display='flex';document.getElementById('iframePlayer').src=type==='tv'?`https://vidlink.pro/tv/${id}/1/1`:`https://vidlink.pro/movie/${id}`;}
function playLive(url){document.getElementById('playerContainer').style.display='flex';document.getElementById('iframePlayer').src='https://hlsplayer.net/embed.html?autoplay=1&url='+encodeURIComponent(url);}
function closePlayer(){document.getElementById('playerContainer').style.display='none';document.getElementById('iframePlayer').src='';}
function switchTab(tab){document.getElementById('movies').style.display=tab==='movie'?'grid':'none';document.getElementById('tv').style.display=tab==='tv'?'grid':'none';document.getElementById('live').style.display=tab==='live'?'grid':'none';document.getElementById('moviesTab').classList.toggle('active',tab==='movie');document.getElementById('tvTab').classList.toggle('active',tab==='tv');document.getElementById('liveTab').classList.toggle('active',tab==='live');if(tab==='movie')displayMovies(moviesData,'movies');if(tab==='tv')displayMovies(tvData,'tv');}
function searchContent(){const q=document.getElementById('search').value.toLowerCase();const filtered=moviesData.filter(m=>m.t.toLowerCase().includes(q));displayMovies(filtered,'movies');document.getElementById('movies').style.display='grid';document.getElementById('tv').style.display='none';document.getElementById('live').style.display='none';}
displayMovies(moviesData,'movies');
</script></body></html>
