<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EDZFLIX</title>
<style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}.tabs{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}.tabs button{padding:10px 18px;border:none;border-radius:8px;background:#222;color:#fff;cursor:pointer}.tabs button.active{background:#1DB954}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.card{background:#222;border-radius:10px;overflow:hidden;cursor:pointer}.card img{width:100%;height:180px;object-fit:cover}.card p{padding:6px;font-size:11px;text-align:center;margin:0}#playerContainer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column}#iframePlayer{width:100%;height:100%;border:none}.close-btn{position:absolute;top:10px;right:10px;z-index:10000;background:red;color:#fff;border:none;padding:10px 15px;border-radius:5px}.live-box{background:linear-gradient(135deg,#222,#333);padding:25px 10px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #1DB954}</style></head><body>
<h1 style="text-align:center;color:#1DB954;margin:5px">EDZ</h1>
<div class="tabs">
<button id="moviesTab" class="active" onclick="switchTab('movie')">Movies</button>
<button id="tvTab" onclick="switchTab('tv')">TV Shows</button>
<button id="liveTab" onclick="switchTab('live')">🔴 LIVE CHANNELS</button>
</div>
<input type="text" id="search" placeholder="Search movie..." style="width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:none;box-sizing:border-box" onkeyup="if(event.key==='Enter')searchContent()">
<div id="movies" class="grid"></div>
<div id="tv" class="grid" style="display:none"></div>
<div id="live" class="grid" style="display:none">
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">📺<br><b>GMA</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">📺<br><b>TV5</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🎬<br><b>A2Z</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🏀<br><b>PBA</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🏀<br><b>NBA</b><br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="playLive('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">🎨<br><b>CARTOON</b><br><span style="color:#1DB954">● LIVE</span></div>
</div>
<div id="playerContainer"><button class="close-btn" onclick="closePlayer()">X Close</button><iframe id="iframePlayer" allowfullscreen></iframe><div style="text-align:center;padding:10px;background:#111"><button onclick="document.getElementById('iframePlayer').requestFullscreen()" style="padding:10px 20px;background:#1DB954;border:none;border-radius:8px;color:#fff">⛶ Fullscreen</button></div></div>
<script>
const IMG_URL='https://image.tmdb.org/t/p/w500';
const API_KEY='03c4e3daaf9d07f14d1bf7cb186389d0';
let currentType='movie';
async function fetchContent(url){try{const res=await fetch(url);const data=await res.json();displayContent(data.results,document.getElementById(currentType==='tv'?'tv':'movies'))}catch(e){document.getElementById(currentType==='tv'?'tv':'movies').innerHTML='<p style=color:#aaa>Loading movies...</p>';}}
function displayContent(items,container){container.innerHTML='';if(!items)return;items.forEach(item=>{if(!item.poster_path)return;const div=document.createElement('div');div.className='card';div.innerHTML=`<img src="${IMG_URL+item.poster_path}" loading="lazy"><p>${(item.title||item.name||'').substring(0,25)}</p>`;div.onclick=()=>openPlayer(item.id,item.media_type||currentType);container.appendChild(div);})}
function openPlayer(id,type){document.getElementById('playerContainer').style.display='flex';document.getElementById('iframePlayer').src=type==='tv'?`https://vidlink.pro/tv/${id}/1/1`:`https://vidlink.pro/movie/${id}`;}
function playLive(url){document.getElementById('playerContainer').style.display='flex';document.getElementById('iframePlayer').src='https://hlsplayer.net/embed.html?autoplay=1&url='+encodeURIComponent(url);}
function closePlayer(){document.getElementById('playerContainer').style.display='none';document.getElementById('iframePlayer').src='';}
function switchTab(tab){currentType=tab;document.getElementById('movies').style.display=tab==='movie'?'grid':'none';document.getElementById('tv').style.display=tab==='tv'?'grid':'none';document.getElementById('live').style.display=tab==='live'?'grid':'none';document.getElementById('moviesTab').classList.toggle('active',tab==='movie');document.getElementById('tvTab').classList.toggle('active',tab==='tv');document.getElementById('liveTab').classList.toggle('active',tab==='live');if(tab==='movie')fetchContent(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`);if(tab==='tv')fetchContent(`https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}`);}
function searchContent(){const q=document.getElementById('search').value;if(!q)return;fetchContent(`https://api.themoviedb.org/3/search/${currentType}?api_key=${API_KEY}&query=${q}`);}
switchTab('movie');
</script></body></html>
