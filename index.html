<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDZFLIX</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tabs button{padding:10px 18px;border:none;border-radius:8px;background:#222;color:#fff;font-weight:bold}
.tabs button.active{background:#1DB954}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.card{background:#222;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:160px;object-fit:cover}
.card p{padding:6px;font-size:11px;text-align:center;margin:0}
.live-box{background:#222;padding:20px 5px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #333}
#playerContainer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column}
#videoPlayer{width:100%;height:70%}
.close-btn{position:absolute;top:10px;right:10px;background:red;color:#fff;border:none;padding:10px 15px;border-radius:5px}
</style>
</head>
<body>
<h1 style="text-align:center;color:#1DB954">EDZFLIX</h1>

<div class="tabs">
<button id="moviesTab" class="active" onclick="switchTab('movie')">Movies</button>
<button id="tvTab" onclick="switchTab('tv')">TV Shows</button>
<button id="liveTab" onclick="switchTab('live')">🔴 LIVE (YouTube)</button>
</div>

<div id="movies" class="grid"></div>
<div id="tv" class="grid" style="display:none"></div>

<!-- LIVE CHANNELS - YOUTUBE LEGAL -->
<div id="live" class="grid" style="display:none">

<!-- GMA Kapuso Stream LIVE - Official YouTube -->
<div class="live-box" onclick="playYouTube('https://www.youtube.com/embed/live_stream?channel=UCFppYJpKa1K-yKavsrCSTDw')">
📺<br><b>GMA Kapuso Stream</b><br><span style="color:#1DB954">● LIVE</span>
</div>

<!-- 24 Oras Live -->
<div class="live-box" onclick="playYouTube('https://www.youtube.com/embed/5qap5aO4i9A')">
📺<br><b>24 Oras Live</b><br><span style="color:#1DB954">● LIVE</span>
</div>

<!-- PBA Official -->
<div class="live-box" onclick="playYouTube('https://www.youtube.com/embed/live_stream?channel=UC_jWgtB0K9Z8xB4jJ4Y6W-Q')">
🏀<br><b>PBA Live</b><br><span style="color:#1DB954">● LIVE</span>
</div>

<!-- NBA Live -->
<div class="live-box" onclick="playYouTube('https://www.youtube.com/embed/live_stream?channel=UCWJ2lWNubArHWmf3FIHbfcQ')">
🏀<br><b>NBA Live</b><br><span style="color:#1DB954">● LIVE</span>
</div>

<!-- TV5 -->
<div class="live-box" onclick="playYouTube('https://www.youtube.com/embed/jfKfPfyJRdk')">
📺<br><b>TV5 / News5</b><br><span style="color:#1DB954">● LIVE</span>
</div>

<!-- Cartoon -->
<div class="live-box" onclick="playYouTube('https://www.youtube.com/embed/5qap5aO4i9A')">
🎨<br><b>Cartoon / Lofi</b><br><span style="color:#1DB954">● LIVE</span>
</div>

</div>

<div id="playerContainer">
<button class="close-btn" onclick="closePlayer()">X Close</button>
<iframe id="iframePlayer" style="width:100%;height:100%;border:none" allowfullscreen></iframe>
</div>

<script>
const moviesData=[
{id:299536,t:"Infinity War",p:"7WsyChQLEftFiDOVTGkv3hFpyyt.jpg"},
{id:299534,t:"Endgame",p:"or06FN3Dka5tukK1e9sl16pB3iy.jpg"},
{id:19995,t:"Avatar",p:"kyeqWdyUXW608qlYkRqosgbbJyK.jpg"},
{id:27205,t:"Inception",p:"ljsZTbVsrQSqZgWeep2B1QiDKuh.jpg"},
{id:155,t:"Dark Knight",p:"qJ2tW6WMUDux911r6m7haRef0WH.jpg"}
];

function displayMovies(list,id){
const c=document.getElementById(id);c.innerHTML='';
list.forEach(m=>{
const d=document.createElement('div');d.className='card';
d.innerHTML=`<img src="https://image.tmdb.org/t/p/w500/${m.p}"><p>${m.t}</p>`;
d.onclick=()=>openMovie(m.id);
c.appendChild(d);
});
}

function openMovie(id){
document.getElementById('playerContainer').style.display='flex';
document.getElementById('iframePlayer').src=`https://vidlink.pro/movie/${id}`;
}

function playYouTube(url){
document.getElementById('playerContainer').style.display='flex';
document.getElementById('iframePlayer').src=url+'?autoplay=1';
}

function closePlayer(){
document.getElementById('playerContainer').style.display='none';
document.getElementById('iframePlayer').src='';
}

function switchTab(tab){
document.getElementById('movies').style.display=tab==='movie'?'grid':'none';
document.getElementById('tv').style.display=tab==='tv'?'grid':'none';
document.getElementById('live').style.display=tab==='live'?'grid':'none';
document.getElementById('moviesTab').classList.toggle('active',tab==='movie');
document.getElementById('tvTab').classList.toggle('active',tab==='tv');
document.getElementById('liveTab').classList.toggle('active',tab==='live');
if(tab==='movie')displayMovies(moviesData,'movies');
}

displayMovies(moviesData,'movies');
</script>
</body>
</html>
