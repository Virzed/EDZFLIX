<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDZFLIX</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:10px}
.tabs{display:flex;gap:10px;margin:10px 0}
.tabs button{padding:10px 20px;border:none;border-radius:8px;background:#222;color:#fff;cursor:pointer}
.tabs button.active{background:#1DB954}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.card{background:#222;border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%}
.card p{padding:5px;font-size:12px;text-align:center}
#playerContainer{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column}
#iframePlayer{width:100%;height:100%;border:none}
.close-btn{position:absolute;top:10px;right:10px;z-index:10000;background:red;color:#fff;border:none;padding:10px;border-radius:5px}
.live-box{width:100%;background:#222;padding:20px;border-radius:10px;text-align:center;cursor:pointer}
</style>
</head>
<body>
<h1 style="text-align:center;color:#1DB954">EDZ</h1>
<div class="tabs">
<button id="moviesTab" class="active" onclick="switchTab('movie')">Movies</button>
<button id="tvTab" onclick="switchTab('tv')">TV Shows</button>
<button id="liveTab" onclick="switchTab('live')">🔴 LIVE CHANNELS</button>
</div>
<input type="text" id="search" placeholder="Search..." style="width:100%;padding:10px;margin-bottom:15px;border-radius:8px;border:none" onkeyup="if(event.key==='Enter')searchContent()">
<div id="movies" class="grid"></div>
<div id="tv" class="grid" style="display:none"></div>
<div id="live" class="grid" style="display:none">
<div class="live-box" onclick="alert('GMA Live - Coming Soon!')">📺<br>GMA<br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="alert('TV5 Live - Coming Soon!')">📺<br>TV5<br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="alert('Kapamilya - Coming Soon!')">🎬<br>A2Z<br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="alert('PBA Live - Coming Soon!')">🏀<br>PBA<br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="alert('NBA Live - Coming Soon!')">🏀<br>NBA<br><span style="color:#1DB954">● LIVE</span></div>
<div class="live-box" onclick="alert('Cartoon - Coming Soon!')">🎨<br>Cartoon<br><span style="color:#1DB954">● LIVE</span></div>
</div>
<div id="playerContainer">
<button class="close-btn" onclick="closePlayer()">X Close</button>
<iframe id="iframePlayer" allowfullscreen></iframe>
<div style="text-align:center;padding:10px;background:#111">
<button onclick="document.getElementById('iframePlayer').requestFullscreen()" style="padding:10px 20px;background:#1DB954;border:none;border-radius:8px;color:#fff">⛶ Fullscreen</button>
</div>
</div>
<script>
const API_KEY='488eb36776275b8ae18600751059f6d6f0e4b0d8e1';
const IMG_URL='https://image.tmdb.org/t/p/w500';
async function fetchContent(url){
const res=await fetch(url);const data=await res.json();displayContent(data.results,document.getElementById(currentType==='tv'?'tv':'movies'))
}
function displayContent(items,container){
container.innerHTML='';
items.forEach(item=>{
const div=document.createElement('div');div.className='card';
div.innerHTML=`<img src="${IMG_URL+item.poster_path}" onerror="this.src='https://via.placeholder.com/150'"><p>${item.title||item.name}</p>`;
div.onclick=()=>openPlayer(item.id);
container.appendChild(div);
})
}
function openPlayer(id){
document.getElementById('playerContainer').style.display='flex';
document.getElementById('iframePlayer').src=`https://vidlink.pro/movie/${id}`;
}
function closePlayer(){
document.getElementById('playerContainer').style.display='none';
document.getElementById('iframePlayer').src='';
}
let currentType='movie';
function switchTab(tab){
document.getElementById('movies').style.display=tab==='movie'?'grid':'none';
document.getElementById('tv').style.display=tab==='tv'?'grid':'none';
document.getElementById('live').style.display=tab==='live'?'grid':'none';
document.getElementById('moviesTab').classList.toggle('active',tab==='movie');
document.getElementById('tvTab').classList.toggle('active',tab==='tv');
document.getElementById('liveTab').classList.toggle('active',tab==='live');
currentType=tab;
if(tab==='movie')fetchContent(`https://api.themoviedb.org/3/movie/popular?api_key=${API_KEY}`);
if(tab==='tv')fetchContent(`https://api.themoviedb.org/3/tv/popular?api_key=${API_KEY}`);
}
function searchContent(){
const q=document.getElementById('search').value;
if(!q)return;
fetchContent(`https://api.themoviedb.org/3/search/${currentType==='tv'?'tv':'movie'}?api_key=${API_KEY}&query=${q}`);
}
switchTab('movie');
</script>
</body>
</html>
